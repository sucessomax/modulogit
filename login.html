<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mind</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mind - Assistente de Estudos</h1>
    </header>
    <main class="auth-page">
        <div class="auth-container">
            <h2>Acessar sua conta</h2>
            <form id="loginForm">
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required minlength="6">
                </div>
                <div>
                    <button type="submit">Entrar</button>
                </div>
            </form>
            <p>Não tem uma conta? <a href="registro.html">Cadastre-se aqui</a></p>
            <p><a href="index.html">Voltar para a página inicial</a></p>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Mind - Todos os direitos reservados.</p>
    </footer>
    <script src="auth.js"></script> <!-- We'll create this later for validation -->
</body>
</html>
